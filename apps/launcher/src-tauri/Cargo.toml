[package]
name = "deluxe8-launcher"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Deluxe8 launcher: setup, configuration and online rooms for a tailored MK8D PC runtime"
publish = false

[lib]
name = "deluxe8_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
d8-nx = { path = "../../../crates/nx" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
igd-next = { version = "0.18", features = ["aio_tokio"] }
sysinfo = "0.40"
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2 = "0.10"
tokio = { version = "1", features = ["process", "io-util", "rt-multi-thread", "sync", "time", "fs", "macros"] }
local-ip-address = "0.6"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Globalization",
] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
