version: 2
updates:
  - package-ecosystem: cargo
    directory: /apps/launcher/src-tauri
    schedule:
      interval: monthly
    groups:
      rust:
        patterns: ['*']
  - package-ecosystem: cargo
    directory: /crates/nx
    schedule:
      interval: monthly
    groups:
      rust:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /apps/launcher
    schedule:
      interval: monthly
    groups:
      ui:
        patterns: ['*']
    ignore:
      # TypeScript 7 (the native compiler) still needs svelte-check's experimental --tsgo mode alongside TypeScript 6
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
