[package]
name = "d8-nx"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Nintendo Switch package handling (NSP/NSZ/NCZ/PFS0/CNMT) for the Deluxe 8 launcher"
authors = ["Deluxe 8 contributors"]

[lib]
name = "d8_nx"
path = "src/lib.rs"

[[bin]]
name = "d8-nx"
path = "src/bin/d8-nx.rs"

[dependencies]
zstd = "0.13"
aes = "0.8"
ctr = "0.9"
sha2 = "0.10"
hex = "0.4"
roxmltree = "0.20"
zip = { version = "2", default-features = false, features = ["deflate"] }
thiserror = "2"
anyhow = "1"
ctrlc = "3"

[profile.release]
# Keep the default opt level; the zstd decode path is the hot loop.
debug = false
